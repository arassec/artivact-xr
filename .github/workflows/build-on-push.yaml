# This workflow file build the Godot project for multiple target systems.
---


# Build workflow
name: Build


# Trigger rules (adjust to configure when CI is performed)
on:
  [push]


# Environment variables
env:
  # Configure Godot version. 
  # The release is downloaded from Github. Example URL for Version '4.6.1':
  # https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
  GODOT_VERSION: 4.6.1


# CI jobs
jobs:
  # Pre-job: Increment version codes in export_presets.cfg for release builds
  bump-version:
    name: Bump Android Version Codes
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      # Check out the default branch (not the tag) so we can push back
      - name: Checkout Default Branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # Increment every version/code=N entry by 1
      - name: Increment version/code in export_presets.cfg
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f export_presets.cfg ]; then
            echo "ERROR: export_presets.cfg not found"
            exit 1
          fi

          echo "--- version/code entries BEFORE increment ---"
          grep -nE 'version/code=' export_presets.cfg || true

          if ! grep -q 'version/code=' export_presets.cfg; then
            echo "ERROR: No version/code entry found in export_presets.cfg"
            exit 1
          fi

          # NOTE: This same perl expression is also used in the build job's release patch step.
          # If you update one, update the other to keep them in sync.
          perl -pi -e 's/version\/code=(\d+)/"version\/code=" . ($1 + 1)/ge' export_presets.cfg

          echo "--- version/code entries AFTER increment ---"
          grep -nE 'version/code=' export_presets.cfg || true

      # Commit and push the incremented values back to the default branch.
      # [skip ci] prevents this push from triggering a new workflow run.
      - name: Commit and push updated export_presets.cfg
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add export_presets.cfg
          if git diff --cached --quiet; then
            echo "No version/code changes to commit"
          else
            git commit -m "chore: bump Android version codes [skip ci]"
            git push origin ${{ github.event.repository.default_branch }}
          fi

  # Build job (Matrix build for all exports)
  build:
    name: Building for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: [bump-version]
    # Run when bump-version succeeded (release) OR was skipped (snapshot/non-tag)
    if: always() && !cancelled() && (needs.bump-version.result == 'success' || needs.bump-version.result == 'skipped')
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        include:
          # Export for Android Quest
          - name: 🤖 Android Quest
            os: ubuntu-22.04
            platform: android
            export-preset: Quest
            export-type: debug
            export-args: --install-android-build-template
            export-folder: build/android-quest
            export-file: Artivact_XR_Quest.apk

          # Export for Android Pico
          - name: 🤖 Android Pico
            os: ubuntu-22.04
            platform: android
            export-preset: Pico
            export-type: debug
            export-args: --install-android-build-template
            export-folder: build/android-pico
            export-file: Artivact_XR_Pico.apk

    steps:
      # Check out the repository
      - name: Checkout
        uses: actions/checkout@v7

      # If targeting android then install JDK
      - name: Set up JDK 17
        if: matrix.platform == 'android'
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # If targeting android then install Android SDK
      - name: Setup Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v4

      # If targeting android then install Android SDK Packages
      - name: Install Android SDK Packages
        if: matrix.platform == 'android'
        run: >
          sdkmanager
          "platform-tools"
          "build-tools;34.0.0"
          "platforms;android-34"
          "cmdline-tools;latest"
          "cmake;3.10.2.4988404"
          "ndk;23.2.8568313"

      # Setup Godot
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true
      
      # Add Release Environment Variables (if building release)
      - name: Add Release Environment Variables
        if: >
          github.event_name == 'push' && 
          github.ref_type == 'tag'
        run: |
          echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"

      # Replace version in godot project file (if building release)
      - name: Replace Version Number
        if: >
          github.event_name == 'push' && 
          github.ref_type == 'tag'
        uses: richardrigutins/replace-in-files@v3
        with:
          files: 'project.godot'
          search-text: '0.0.0'
          replacement-text: ${{ env.RELEASE_VERSION }}

      # Generate a numeric version code from the current UTC date/time (snapshot builds only)
      - name: Generate Version Code
        if: matrix.platform == 'android' && github.ref_type != 'tag'
        shell: bash
        run: |
          VERSION_CODE="$(date -u +'%Y%m%d%H%M')"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Generated VERSION_CODE=$VERSION_CODE"

      # Patch version/code in export_presets.cfg
      # - Release builds: increment the checked-in value by 1 (matches what bump-version pushed)
      # - Snapshot builds: replace with the date-based value generated above
      - name: Patch Android Version Code
        if: matrix.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f export_presets.cfg ]; then
            echo "ERROR: export_presets.cfg not found"
            exit 1
          fi

          echo "--- export_presets.cfg version entries BEFORE patch ---"
          grep -nE 'version/(code|name)=' export_presets.cfg || true

          if ! grep -q 'version/code=' export_presets.cfg; then
            echo "ERROR: No version/code entry found in export_presets.cfg"
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            # Release build: increment each checked-in version/code by 1.
            # NOTE: This uses the same perl expression as the bump-version pre-job (line 58).
            # If you update one, update the other to keep them in sync.
            perl -pi -e 's/version\/code=(\d+)/"version\/code=" . ($1 + 1)/ge' export_presets.cfg

            if [ -n "${RELEASE_VERSION:-}" ]; then
              if grep -q 'version/name=' export_presets.cfg; then
                perl -0pi -e 's/version\/name="[^"]*"/version\/name="'"$RELEASE_VERSION"'"/g' export_presets.cfg
              fi
            fi
          else
            # Snapshot build: use the date-based version code generated above.
            # VERSION_CODE is always set here because 'Generate Version Code' runs
            # for all non-tag Android builds (same conditions as this else branch).
            perl -0pi -e 's/version\/code=\d+/version\/code='"$VERSION_CODE"'/g' export_presets.cfg
          fi

          echo "--- export_presets.cfg version entries AFTER patch ---"
          grep -nE 'version/(code|name)=' export_presets.cfg || true

      # Import Godot Project
      - name: Initial Godot Import
        shell: bash
        run: |
          godot --headless --import || exit 0

      # Export project - Regular Build
      - name: Export Godot Project (SNAPSHOT Build)
        if: >
          github.event_name == 'push' && 
          github.ref_type != 'tag'
        shell: bash
        run: >
          godot
          --headless
          ${{ matrix.export-args }}
          --export-debug "${{ matrix.export-preset }}"

      # Export project - Release Build
      - name: Export Godot Project (Release Build)
        if: >
          github.event_name == 'push' && 
          github.ref_type == 'tag'
        shell: bash
        env:
          AVXR_KEYSTORE_BASE64: ${{ secrets.AVXR_RELEASE_KEYSTORE }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: "artivact-xr-release.keystore"
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.AVXR_RELEASE_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.AVXR_RELEASE_PASS }}
        run: |
          set -euo pipefail
          echo "$AVXR_KEYSTORE_BASE64" > ./artivact-xr-release.keystore.base64.txt
          openssl base64 -A -d -in ./artivact-xr-release.keystore.base64.txt -out ./artivact-xr-release.keystore
          godot --headless ${{ matrix.export-args }} --export-release "${{ matrix.export-preset }}"

      # Upload artifacts
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.export-file }}
          path: |
            ${{ matrix.export-folder }}/${{ matrix.export-file }}

      # Add Version to Filename (if building release)
      - name: Add Release Version to Filename
        if: >
          github.event_name == 'push' && 
          github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_FILE="$(echo "${{ matrix.export-file }}" | cut -d "." -f 1)"
          RELEASE_FILE+="_v$RELEASE_VERSION.apk"
          echo "RELEASE_FILE: $RELEASE_FILE"
          mv "${{ matrix.export-folder }}/${{ matrix.export-file }}" "${{ matrix.export-folder }}/$RELEASE_FILE"
          ls ${{ matrix.export-folder }}/
          echo "RELEASE_FILE=$RELEASE_FILE" >> $GITHUB_ENV

      # Publish release (if building release)
      - name: Publish Release
        uses: ncipollo/release-action@v1
        if: >
          github.event_name == 'push' && 
          github.ref_type == 'tag'
        with:
          allowUpdates: true
          artifacts: '${{ matrix.export-folder }}/${{ env.RELEASE_FILE }}'
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # Prepare publish to Meta (if building release)
      - name: Prepare Release for Meta Upload
        uses: RageAgainstThePixel/setup-ovr-platform-util@v1
        if: >
          github.event_name == 'push' && 
          github.ref_type == 'tag' &&
          contains(env.RELEASE_FILE, 'Quest')          
        
      # Publish release to Meta (if building release)
      - name: Upload Release to Meta
        uses: RageAgainstThePixel/upload-meta-quest-build@v2
        if: >
          github.event_name == 'push' && 
          github.ref_type == 'tag' &&
          contains(env.RELEASE_FILE, 'Quest')
        with:
          ageGroup: 'TEENS_AND_ADULTS'
          appId: ${{ secrets.OVR_APP_ID }}
          appSecret: ${{ secrets.OVR_APP_SECRET }}
          apkPath: '${{ matrix.export-folder }}/${{ env.RELEASE_FILE }}'
          releaseChannel: 'ALPHA'
