# This workflow file build the Godot project for multiple target systems.
---


# Build workflow
name: Build


# Trigger rules (adjust to configure when CI is performed)
on:
  [push]


# Environment variables
env:
  # Configure Godot version. 
  # The release is downloaded from Github. Example URL for Version '4.6.1':
  # https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
  GODOT_VERSION: 4.6.1


# CI jobs
jobs:
  # Build job (Matrix build for all exports)
  build:
    name: Building for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        include:
          # Export for Android Quest
          - name: 🤖 Android Quest
            os: ubuntu-22.04
            platform: android
            export-preset: Quest
            export-type: debug
            export-args: --install-android-build-template
            export-folder: build/android-quest
            export-file: Artivact_XR_Quest.apk

          # Export for Android Pico
          - name: 🤖 Android Pico
            os: ubuntu-22.04
            platform: android
            export-preset: Pico
            export-type: debug
            export-args: --install-android-build-template
            export-folder: build/android-pico
            export-file: Artivact_XR_Pico.apk

    steps:
      # Check out the repository
      - name: Checkout
        uses: actions/checkout@v4

      # If targeting android then install JDK
      - name: Set up JDK 17
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # If targeting android then install Android SDK
      - name: Setup Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3

      # If targeting android then install Android SDK Packages
      - name: Install Android SDK Packages
        if: matrix.platform == 'android'
        run: >
          sdkmanager
          "platform-tools"
          "build-tools;34.0.0"
          "platforms;android-34"
          "cmdline-tools;latest"
          "cmake;3.10.2.4988404"
          "ndk;23.2.8568313"

      # Setup Godot
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true
      
      # Add Release Environment Variables (if building release)
      - name: Add Release Environment Variables
        if: >
          github.event_name == 'push' && 
          github.ref_type == 'tag'
        run: |
          echo "RELEASE_VERSION=${GITHUB_REF:11}" >> $GITHUB_ENV

      # Replace version in godot project file (if building release)
      - name: Replace Version Number
        if: >
          github.event_name == 'push' && 
          github.ref_type == 'tag'
        uses: richardrigutins/replace-in-files@v2
        with:
          files: 'project.godot'
          search-text: '0.0.0'
          replacement-text: ${{ env.RELEASE_VERSION }}

      # Import Godot Project
      - name: Initial Godot Import
        shell: bash
        run: |
          godot --headless --import || exit 0

      # Export project - Regular Build
      - name: Export Godot Project (SNAPSHOT Build)
        if: >
          github.event_name == 'push' && 
          github.ref_type != 'tag'
        shell: bash
        run: >
          godot
          --headless
          ${{ matrix.export-args }}
          --export-debug "${{ matrix.export-preset }}"

      # Export project - Release Build
      - name: Export Godot Project (Release Build)
        if: >
          github.event_name == 'push' && 
          github.ref_type == 'tag'
        shell: bash
        env:
          AVXR_KEYSTORE_BASE64: ${{ secrets.AVXR_RELEASE_KEYSTORE }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: "artivact-xr-release.keystore"
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.AVXR_RELEASE_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.AVXR_RELEASE_PASS }}
        run: |
          echo "$AVXR_KEYSTORE_BASE64" > ./artivact-xr-release.keystore.base64.txt
          openssl base64 -A -d -in ./artivact-xr-release.keystore.base64.txt -out ./artivact-xr-release.keystore
          godot --headless ${{ matrix.export-args }} --export-release "${{ matrix.export-preset }}"

      # Upload artifacts
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.export-file }}
          path: |
            ${{ matrix.export-folder }}/${{ matrix.export-file }}

      # Add Version to Filename (if building release)
      - name: Add Release Version to Filename
        if: >
          github.event_name == 'push' && 
          github.ref_type == 'tag'
        run: |
          RELEASE_FILE=`echo ${{ matrix.export-file }} | cut -d "." -f 1`
          RELEASE_FILE+="_v$RELEASE_VERSION.apk"
          echo "RELEASE_FILE: $RELEASE_FILE"
          mv ${{ matrix.export-folder }}/${{ matrix.export-file }} ${{ matrix.export-folder }}/$RELEASE_FILE
          ls ${{ matrix.export-folder }}/
          echo "RELEASE_FILE=$RELEASE_FILE" >> $GITHUB_ENV

      # Publish release (if building release)
      - name: Publish Release
        uses: ncipollo/release-action@v1
        if: >
          github.event_name == 'push' && 
          github.ref_type == 'tag'
        with:
          allowUpdates: true
          artifacts: '${{ matrix.export-folder }}/${{ env.RELEASE_FILE }}'
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # Prepare publish to Meta (if building release)
      - name: Prepare Release for Meta Upload
        uses: RageAgainstThePixel/setup-ovr-platform-util@v1
        if: >
          github.event_name == 'push' && 
          github.ref_type == 'tag' &&
          contains(env.RELEASE_FILE, 'Quest')          
        
      # Publish release to Meta (if building release)
      - name: Upload Release to Meta
        uses: RageAgainstThePixel/upload-meta-quest-build@v2
        if: >
          github.event_name == 'push' && 
          github.ref_type == 'tag' &&
          contains(env.RELEASE_FILE, 'Quest')
        with:
          ageGroup: 'TEENS_AND_ADULTS'
          appId: ${{ secrets.OVR_APP_ID }}
          appSecret: ${{ secrets.OVR_APP_SECRET }}
          apkPath: '${{ matrix.export-folder }}/${{ env.RELEASE_FILE }}'
          releaseChannel: 'ALPHA'

